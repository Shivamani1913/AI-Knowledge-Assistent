<!DOCTYPE html>
<html>
<head><title>Chat Test</title></head>
<body>
  <h2>Chat Test</h2>
  <div id="log" style="font-family: monospace; white-space: pre-wrap; max-width: 700px;"></div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/microsoft-signalr/8.0.0/signalr.min.js"></script>
  <script>
    const token = prompt("Paste your JWT token:");
    const question = prompt("Ask a question about your uploaded document:");

    const connection = new signalR.HubConnectionBuilder()
      .withUrl("http://localhost:5184/hubs/chat", {
        accessTokenFactory: () => token
      })
      .build();

    const log = document.getElementById("log");

    connection.on("ReceiveAnswerChunk", (chunk) => {
      if (chunk.type === "token") {
        log.textContent += chunk.text;
      } else if (chunk.type === "citations") {
        log.textContent += "\n\n--- Citations ---\n" + JSON.stringify(chunk.citations, null, 2);
      }
    });

    connection.start()
      .then(() => {
        log.textContent += "Connected. Asking...\n\n";
        return connection.invoke("AskQuestion", crypto.randomUUID(), question);
      })
      .catch(err => log.textContent += "Error: " + err);
  </script>
</body>
</html>
